name: Sync public profiles to sexytw.cc

on:
  # Cloudflare sexytw-site now dispatches main every six hours (Taiwan
  # 00:17 / 06:17 / 12:17 / 18:17). Keep the manual Run workflow control.
  # Do not restore a second GitHub schedule: it could duplicate the CF trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sexytw-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nning00/sexytw-site'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize profiles to sexytw.cc
        env:
          PROFILE_SYNC_ENDPOINT: https://sexytw.cc/api/profile-sync
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --commit --create-only --presence-v3
