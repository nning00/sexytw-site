name: Sync public profiles to sexytw.cc

on:
  schedule:
    # Every six hours: 00:17, 06:17, 12:17 and 18:17 in Taiwan.
    # Offset from the other sites; GitHub schedules remain best-effort.
    - cron: "17 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sexytw-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize profiles to sexytw.cc
        env:
          PROFILE_SYNC_ENDPOINT: https://sexytw.cc/api/profile-sync
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --commit
