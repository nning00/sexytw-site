name: Sync public profiles to sexytw.cc

on:
  schedule:
    # Every six hours. GitHub cron uses UTC: 00:30, 06:30, 12:30 and 18:30 in Taiwan.
    - cron: "30 16,22,4,10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sexytw-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize profiles to sexytw.cc
        env:
          PROFILE_SYNC_ENDPOINT: ${{ secrets.PROFILE_SYNC_ENDPOINT }}
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --commit
