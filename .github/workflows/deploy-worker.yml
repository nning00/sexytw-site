name: Read-only sexytw release baseline
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sexytw-production-deploy
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'nning00/sexytw-site' && github.ref == 'refs/heads/review/sexytw-readonly-baseline-20261113' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact identity
        env:
          EXPECTED: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED"
      - run: npm install --prefix "$RUNNER_TEMP/read-cli" --ignore-scripts --no-audit --no-fund wrangler@4.92.0
      - name: Read current deployment only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = f9f173ed7748397ad18c0df63220fc3f
          "$RUNNER_TEMP/read-cli/node_modules/.bin/wrangler" deployments list --name sexytw-site --json > "$RUNNER_TEMP/deployments.json"
          node -e 'const fs=require("fs");let a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/deployments.json"));a.sort((x,y)=>Date.parse(y.created_on)-Date.parse(x.created_on));const d=a[0];if(!d||d.versions.length!==1||!d.versions[0].version_id.startsWith("89bf9086-")||d.versions[0].percentage!==100)throw Error("BASELINE_CHANGED");console.log(JSON.stringify({deployment:d.id,created_on:d.created_on,versions:d.versions,readOnly:true}));'
