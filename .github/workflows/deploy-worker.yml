name: Deploy sexytw.cc Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'nning00/sexytw-site'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/profile-sync-target.test.mjs scripts/profile-sync-dispatch.test.mjs
      - run: pnpm build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Verify dedicated sync target without writing profiles
        env:
          PROFILE_SYNC_ENDPOINT: https://sexytw.cc/api/profile-sync
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --verify-only
