name: Deploy sexytw.cc Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sexytw-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'nning00/sexytw-site' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pr-checks.yml

  deploy:
    needs: validate
    if: github.repository == 'nning00/sexytw-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/*.test.mjs
      - run: pnpm exec tsc --noEmit
      - name: Build production artifact (never reuse fixture build)
        run: pnpm build
        env:
          SEXYTW_CI_FIXTURE_BUILD: "0"
          WRANGLER_SEND_METRICS: "false"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Guard production artifact
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const config = JSON.parse(readFileSync("dist/server/wrangler.json", "utf8"));
            assert.equal(config.name, "sexytw-site");
            assert.equal(config.vars.NEXT_PUBLIC_SUPABASE_URL, "https://lsxrpubpbnshlqnnddgu.supabase.co");
            assert.notEqual(process.env.SEXYTW_CI_FIXTURE_BUILD, "1");
          '
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Verify dedicated sync target without writing profiles
        env:
          PROFILE_SYNC_ENDPOINT: https://sexytw.cc/api/profile-sync
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --verify-only
