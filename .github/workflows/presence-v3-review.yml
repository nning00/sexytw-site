name: Presence v3 isolated review (no deployment)
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/presence-v3-review.yml'
      - 'app/api/profile-sync/route.ts'
      - 'lib/cms.ts'
      - 'scripts/edc-profile-sync.mjs'
      - 'supabase/presence-v3.review.sql'
      - 'tests/presence-v3.integration.mjs'
      - 'lib/profile-presence-v3.mjs'
      - 'scripts/presence-v3.test.mjs'
permissions:
  contents: read
jobs:
  postgres-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-only-not-production
          POSTGRES_DB: sexytw_fixture
        ports:
          - 55514:5432
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d sexytw_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/presence-v3.test.mjs
      - run: node --test tests/presence-v3.integration.mjs
        env:
          PGHOST: '127.0.0.1'
          PGPORT: '55514'
          PGDATABASE: sexytw_fixture
          PGUSER: fixture_admin
          PGPASSWORD: fixture-only-not-production
