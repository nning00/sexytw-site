name: Repair four existing sexytw drafts (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sexytw-profile-sync
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'nning00/sexytw-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair only the independently verified incomplete drafts
        env:
          PROFILE_SYNC_ENDPOINT: https://sexytw.cc/api/profile-sync
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
        run: node scripts/edc-profile-sync.mjs --commit --create-only --repair-known-drafts
