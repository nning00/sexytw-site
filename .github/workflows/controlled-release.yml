name: Controlled sexytw release
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved main SHA
        required: true
        type: string
      expected_previous_version:
        description: Exact verified current 100 percent Cloudflare version
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: sexytw-production-deploy
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse wrong ref, stale input and rerun attempts
        env:
          EXPECTED: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED"
          test "$GITHUB_RUN_ATTEMPT" = 1
  validate:
    needs: identity
    uses: ./.github/workflows/recovery-checks.yml
  release:
    # RELEASE HOLD: do not remove until reviewed, authorized and provider rollback verified.
    if: false
    needs: [identity, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Release or restore baseline on failure
        run: node scripts/controlled-release.mjs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_PREVIOUS_VERSION: ${{ inputs.expected_previous_version }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROFILE_SYNC_SECRET: ${{ secrets.PROFILE_SYNC_SECRET }}
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: warn
